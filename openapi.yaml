          properties:
            total: { type: integer }
            demo: { type: integer }
            live: { type: integer }
        trackedCustomers: { type: integer }
        liveAvailable: { type: boolean }
    SimulatorStatus:
      type: object
      required: [running, intervalSeconds, scenario, generatedCount]
      properties:
        running: { type: boolean }
        intervalSeconds: { type: number }
        scenario: { type: string }
        generatedCount: { type: integer }
        lastEventId: { type: [string, 'null'] }
        lastError: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
    SimulatorActionResponse:
      type: object
      required: [ok, simulator]
