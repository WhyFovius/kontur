          type: array
          items:
            type: object
            properties:
              eventId: { type: string }
              baseScore: { type: [number, 'null'] }
              demoModifier: { type: number }
              previousRiskScore: { type: [number, 'null'] }
              riskScore: { type: number }
              riskPercent: { type: integer }
              riskLevel: { type: string }
              riskDelta: { type: number }
              reasons: { type: array, items: { type: string } }
              source: { type: string }
              mode: { type: string }
              isDemo: { type: boolean }
              calculatedAt: { type: string, format: date-time }
    RealtimeStatusResponse:
      type: object
      required: [generatedAt, sources, simulator, scenarios, thresholds, eventCounts, trackedCustomers, liveAvailable]
      properties:
        generatedAt: { type: string, format: date-time }
        sources: { type: array, items: { type: object } }
