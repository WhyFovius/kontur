openapi: 3.1.0
info:
  title: Churn Risk API
  version: 2.0.0
  description: >-
    Explainable customer churn-risk prioritization. Money values in customer and
    snapshot payloads are integer eurocents. This is a heuristic score, not a
    calibrated probability.
servers:
  - url: http://localhost:8000
tags:
  - name: Authentication
  - name: Customers
  - name: Analytics
  - name: Model
  - name: Source
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Create an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session created; an HttpOnly cookie is set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Login rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Return the current administrator
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Current session identity.
          content:
            application/json:
              schema:
                type: object
                required: [username]
                properties:
                  username: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/providers:
    get:
      tags: [Authentication]
      summary: List enabled login methods (password / OIDC)
      responses:
        '200':
          description: Enabled authentication providers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProvidersResponse' }
  /api/v1/auth/oidc/login:
    get:
      tags: [Authentication]
      summary: Start the OIDC authorization-code flow (PKCE)
      responses:
        '302':
          description: Redirect to the identity provider.
        '503':
          description: OIDC is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/auth/oidc/callback:
    get:
      tags: [Authentication]
      summary: OIDC callback — verifies the ID token and creates a session
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '303':
          description: Redirect to the panel on success, to /login?oidc_error=1 on failure.
        '503':
          description: OIDC is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customers with risk analysis
      security: [{ AdminSession: [] }]
      parameters:
        - in: query
          name: risk
          schema: { type: string, enum: [high, medium, low, unrated] }
        - in: query
          name: sort
          schema: { type: string, enum: [id, email, balance, totalReplenished, score], default: score }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Page of sanitized customer projections.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/customers/{customer_id}:
    get:
      tags: [Customers]
      summary: Get one customer's risk analysis
      security: [{ AdminSession: [] }]
      parameters:
        - in: path
          name: customer_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sanitized customer projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Customer not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Get aggregate risk and revenue metrics
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Current analytics summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/analytics/churn-timeline:
    get:
      tags: [Analytics]
      summary: Historical deletions (fact) vs expected non-renewals (forecast)
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Fact/forecast churn timeline buckets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChurnTimelineResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/analytics/rescue-queue:
    get:
      tags: [Analytics]
      summary: Rank urgent customers by rescue value, next action and deadline
      security: [{ AdminSession: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: minimum_score, in: query, schema: { type: integer, minimum: 0, maximum: 100, default: 65 } }
      responses:
        '200':
          description: Prioritized, explainable rescue actions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RescueQueueResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications:
    get:
      tags: [Analytics]
      summary: List persistent realtime risk notifications
      security: [{ AdminSession: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: unread_only, in: query, schema: { type: boolean, default: false } }
        - { name: read_only, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Risk notification inbox and unread counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/read-all:
    post:
      tags: [Analytics]
      summary: Mark every risk notification as read
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Updated unread counter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationReadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/{notification_id}/read:
    post:
      tags: [Analytics]
      summary: Mark one risk notification as read
      security: [{ AdminSession: [] }]
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The updated notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationReadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/{notification_id}/unread:
    post:
      tags: [Analytics]
      summary: Move one notification from the read archive back to unread
      security: [{ AdminSession: [] }]
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The notification restored to the unread folder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationReadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/events/stream:
    get:
      tags: [Analytics]
      summary: Server-Sent Events stream of newly detected risk episodes
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: An initial snapshot event, then notification events and heartbeats.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/realtime/status:
    get:
      tags: [Realtime]
      summary: Get realtime source, DEMO simulator and threshold status
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Honest DEMO/LIVE adapter status and active thresholds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/demo/generate:
    post:
      tags: [Realtime]
      summary: Generate and process one DEMO event through the backend pipeline
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoGenerateRequest' }
      responses:
        '200':
          description: Persisted processed event; repeated eventId returns the duplicate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/ValidationError' }
  /api/v1/demo/simulator/start:
    post:
      tags: [Realtime]
      summary: Start the DEMO event simulator
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatorStartRequest' }
      responses:
        '200':
          description: Simulator status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorActionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/demo/simulator/stop:
    post:
      tags: [Realtime]
      summary: Stop the DEMO event simulator
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Simulator status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorActionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/demo/reset:
    post:
      tags: [Realtime]
      summary: Reset DEMO events, calculations and simulated reactions only
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Deleted DEMO row counts. Live snapshot data is untouched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoResetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/realtime/events:
    get:
      tags: [Realtime]
      summary: List persisted realtime events with filters
      security: [{ AdminSession: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: severity, in: query, schema: { type: string, enum: [critical, warning, info] } }
        - { name: event_type, in: query, schema: { type: string, maxLength: 80 } }
        - { name: customer_id, in: query, schema: { type: string, maxLength: 160 } }
        - { name: mode, in: query, schema: { type: string, enum: [DEMO, LIVE] } }
        - { name: source, in: query, schema: { type: string, maxLength: 40 } }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
      responses:
        '200':
          description: Newest events first and the replay cursor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeEventListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/realtime/customers/{customer_id}/history:
    get:
      tags: [Realtime]
      summary: Get one customer's event and risk-calculation history
      security: [{ AdminSession: [] }]
      parameters:
        - { name: customer_id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Flight Recorder history for the customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerRealtimeHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/realtime/dashboard:
    get:
      tags: [Realtime]
      summary: Get realtime monitoring aggregates and saved-history series
      security: [{ AdminSession: [] }]
      parameters:
        - { name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 720, default: 24 } }
      responses:
        '200':
          description: Current distribution plus actual saved calculation/event series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeDashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/realtime/templates:
    get:
      tags: [Realtime]
      summary: List automatic reaction templates
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Reaction templates ordered by priority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionTemplateListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/realtime/templates/{template_id}:
    patch:
      tags: [Realtime]
      summary: Update a reaction template
      security: [{ AdminSession: [] }]
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReactionTemplatePatch' }
      responses:
        '200':
          description: Updated reaction template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/realtime/outbox:
    get:
      tags: [Realtime]
      summary: List queued or simulated reaction messages
      security: [{ AdminSession: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Reaction outbox; DEMO sends are explicitly simulated_sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionOutboxResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/realtime/stream:
    get:
      tags: [Realtime]
      summary: Replayable Server-Sent Events stream of persisted realtime events
      security: [{ AdminSession: [] }]
      parameters:
        - { name: last_event_id, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Ready/replay events, then new realtime_event messages with SSE ids and heartbeats.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/model/settings:
    get:
      tags: [Model]
      summary: Get model weights, labels and risk thresholds
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Current persisted model configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Model]
      summary: Update one or more feature weights
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weights]
              additionalProperties: false
              properties:
                weights:
                  type: object
                  minProperties: 1
                  maxProperties: 64
                  additionalProperties: { type: number, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Updated model configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/source/snapshot:
    put:
      tags: [Source]
      summary: Atomically replace the source snapshot
      description: >-
        Validates the entire snapshot before replacing current data. Request
        body is limited to 32 MiB. Every relation must reference an account;
        monetary fields use integer eurocents. Accepts accounts/users/customers/clients,
        services/subscriptions and transactions/payments, directly or inside a
        data or snapshot object. Services and transactions may also be nested in
        each account; their owner is then inferred from the account id. Common
        snake_case field aliases are normalized (email_address, withdraw_balance,
        bonus_balance, bonus_state, total_replenished, account_id, user_id,
        customer_id, client_id, payment_term, billing_period, auto_renew, expires_at).
        Multiple aliases for the same field or collection are rejected. An explicit
        accounts collection (or alias) is required, including for empty snapshots.
        Unknown metadata fields are ignored; monetary units and statuses are not inferred.
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Snapshot' }
      responses:
        '200':
          description: Snapshot accepted and stored.
          content:
            application/json:
              schema:
                type: object
                required: [ok, accountCount]
                properties:
                  ok: { type: boolean, const: true }
                  accountCount: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Request body exceeds the configured size limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /metrics:
    get:
      tags: [Analytics]
      summary: Export aggregate metrics in Prometheus text format
      description: Public endpoint; exports aggregate counts and estimated loss without personal data.
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: churn_session
      description: HttpOnly session cookie returned by the login endpoint.
  responses:
    Unauthorized:
      description: A valid administrator session is required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: {}
  schemas:
    Error:
      type: object
      properties:
        detail: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    LoginResponse:
      type: object
      required: [username, expiresAt]
      properties:
        username: { type: string }
        expiresAt: { type: string, format: date-time }
    Customer:
      type: object
      required: [id, email, balance, totalReplenished, score, riskLevel, reasons, services, features, estimatedLoss, monthlyRevenue]
      properties:
        id: { type: string }
        email: { type: string }
        balance: { type: number, description: Integer eurocents in the source data. }
        availableBalance: { type: [number, 'null'], description: Eurocents; includes usable bonus balance. }
        totalReplenished: { type: number, description: Eurocents. }
        score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        riskLevel: { type: string, enum: [high, medium, low, unrated] }
        reasons: { type: array, items: { type: string } }
        services:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string, enum: [active, suspended, prolong_wait, deleted, blocked] }
              price: { type: number, description: Eurocents. }
              paymentTerm: { type: string, enum: [hour, week, month, quarter_year, half_year, year] }
              autoprolong: { type: boolean }
              expiresAt: { type: [string, 'null'], format: date-time }
        features: { type: object, additionalProperties: { type: boolean } }
        estimatedLoss: { type: integer, description: Three-month potential loss in eurocents. }
        monthlyRevenue: { type: integer, description: Estimated monthly revenue in eurocents. }
        daysToExpiry: { type: [number, 'null'] }
    AuthProvidersResponse:
      type: object
      required: [password, oidc]
      properties:
        password: { type: boolean }
        oidc:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            name: { type: [string, 'null'] }
            loginUrl: { type: [string, 'null'] }
    ChurnTimelineResponse:
      type: object
      required: [generatedAt, past, future, totals, method]
      properties:
        generatedAt: { type: string }
        past:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              fromDays: { type: integer }
              toDays: { type: integer }
              deleted: { type: integer }
        future:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              fromDays: { type: integer }
              toDays: { type: integer }
              servicesAtRisk: { type: integer }
              expectedNonRenewals: { type: number }
        totals:
          type: object
          properties:
            deletedServices: { type: integer }
            deleted90d: { type: integer }
            servicesAtRisk30d: { type: integer }
            expectedNonRenewals30d: { type: number }
            servicesAtRisk90d: { type: integer }
            expectedNonRenewals90d: { type: number }
        method: { type: string }
    RiskNotification:
      type: object
      required: [id, episodeKey, type, severity, title, message, estimatedLoss, firstSeenAt, lastSeenAt, isRead]
      properties:
        id: { type: integer }
        episodeKey: { type: string }
        customerId: { type: [string, 'null'] }
        customerEmail: { type: [string, 'null'] }
        type: { type: string }
        severity: { type: string, enum: [critical, warning, info] }
        title: { type: string }
        message: { type: string }
        score: { type: [integer, 'null'] }
        riskLevel: { type: [string, 'null'] }
        estimatedLoss: { type: integer, description: Eurocents. }
        daysToExpiry: { type: [number, 'null'] }
        requiredTopUp: { type: [integer, 'null'], description: Eurocents. }
        source: { type: string, example: demo }
        mode: { type: string, enum: [LIVE, DEMO] }
        eventId: { type: [string, 'null'] }
        previousScore: { type: [integer, 'null'] }
        riskDelta: { type: [number, 'null'] }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        isRead: { type: boolean }
    NotificationListResponse:
      type: object
      required: [items, total, unreadCount, readCount, criticalCount, generatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RiskNotification' } }
        total: { type: integer }
        unreadCount: { type: integer }
        readCount: { type: integer }
        criticalCount: { type: integer }
        generatedAt: { type: string, format: date-time }
    NotificationReadResponse:
      type: object
      required: [ok, updatedCount, unreadCount]
      properties:
        ok: { type: boolean, const: true }
        notification: { oneOf: [{ $ref: '#/components/schemas/RiskNotification' }, { type: 'null' }] }
        updatedCount: { type: integer }
        unreadCount: { type: integer }
    RescueQueueResponse:
      type: object
      required: [generatedAt, items, totals, method]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [rank, customerId, email, score, riskLevel, estimatedLoss, monthlyRevenue, rescueValue, valuePerDay, priorityIndex, actionType, actionLabel, actionDetail, confidence, confidenceScore, reasons]
            properties:
              rank: { type: integer }
              customerId: { type: string }
              email: { type: string }
              score: { type: integer }
              riskLevel: { type: string, enum: [high, medium, low, unrated] }
              estimatedLoss: { type: integer, description: Eurocents. }
              monthlyRevenue: { type: integer, description: Eurocents. }
              rescueValue: { type: integer, description: Eurocents. }
              valuePerDay: { type: integer, description: Eurocents. }
              priorityIndex: { type: integer, minimum: 1, maximum: 100 }
              actionType: { type: string }
              actionLabel: { type: string }
              actionDetail: { type: string }
              requiredTopUp: { type: [integer, 'null'], description: Eurocents. }
              deadlineAt: { type: [string, 'null'], format: date-time }
              dueInDays: { type: [number, 'null'] }
              serviceName: { type: [string, 'null'] }
              predictedScoreAfterAction: { type: [integer, 'null'] }
              confidence: { type: string, enum: [high, medium, low] }
              confidenceScore: { type: integer }
              reasons: { type: array, items: { type: string } }
        totals:
          type: object
          properties:
            eligibleCustomers: { type: integer }
            criticalCustomers: { type: integer }
            rescueValue: { type: integer, description: Eurocents. }
            top3RescueValue: { type: integer, description: Eurocents. }
            requiredTopUps: { type: integer, description: Eurocents. }
        method: { type: string }
    AnalyticsSummary:
      type: object
      required: [customerCount, ratedCount, unratedCount, highRisk, mediumRisk, lowRisk, estimatedLoss, monthlyRevenueAtRisk, atRiskServices, churnForecast, currency, unit]
      properties:
        customerCount: { type: integer }
        ratedCount: { type: integer }
        unratedCount: { type: integer }
        highRisk: { type: integer }
        mediumRisk: { type: integer }
        lowRisk: { type: integer }
        estimatedLoss: { type: integer, description: Eurocents. }
        monthlyRevenueAtRisk: { type: integer, description: Eurocents. }
        atRiskServices: { type: integer }
        churnForecast:
          type: object
          required: [days, counts]
          properties:
            days: { type: array, items: { type: integer } }
            counts: { type: array, items: { type: integer } }
        currency: { type: string, const: EUR }
        unit: { type: string, const: eurocents }
    ModelSettings:
      type: object
      required: [weights, features, thresholds, horizonMonths]
      properties:
        weights: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 100 } }
        features: { type: object, additionalProperties: { type: string } }
        thresholds:
          type: object
          properties:
            medium: { type: integer, const: 35 }
            high: { type: integer, const: 65 }
        horizonMonths: { type: integer, const: 3 }
    Snapshot:
      type: object
      additionalProperties: false
      properties:
        accounts:
          type: array
          maxItems: 100000
          items:
            type: object
            required: [id]
            properties:
              id: { type: [string, integer] }
              email: { type: string, maxLength: 320 }
              balance: { type: integer, minimum: 0, description: Eurocents. }
              withdrawBalance: { type: integer, minimum: 0, description: Eurocents. }
              bonusBalance: { type: integer, minimum: 0, description: Eurocents. }
              bonusState: { type: boolean }
              totalReplenished: { type: integer, minimum: 0, description: Eurocents. }
              telegram: { type: string, maxLength: 160, description: Optional reaction contact; never returned by customer endpoints. }
              whatsapp: { type: string, maxLength: 160, description: Optional reaction contact; never returned by customer endpoints. }
              vk: { type: string, maxLength: 160, description: Optional reaction contact; never returned by customer endpoints. }
              socials:
                type: object
                description: Optional nested reaction contacts.
                properties:
                  telegram: { type: string, maxLength: 160 }
                  whatsapp: { type: string, maxLength: 160 }
                  vk: { type: string, maxLength: 160 }
        users:
          type: array
          description: Legacy alias for accounts.
          items: { type: object }
        services:
          type: array
          maxItems: 500000
          items:
            type: object
            required: [id, status]
            properties:
              id: { type: [string, integer] }
              accountId: { type: [string, integer] }
              userId: { type: [string, integer], description: Legacy account relation alias. }
              account_id: { type: [string, integer], description: Legacy account relation alias. }
              status: { type: string, enum: [active, suspended, prolong_wait, deleted, blocked] }
              price: { type: integer, minimum: 0, description: Eurocents. }
              paymentTerm: { type: string, enum: [hour, week, month, quarter_year, half_year, year] }
        transactions:
          type: array
          maxItems: 1000000
          items:
            type: object
            required: [id, status, type]
            properties:
              id: { type: [string, integer] }
              accountId: { type: [string, integer] }
              userId: { type: [string, integer] }
              account_id: { type: [string, integer] }
              status: { type: string, enum: [performed, not_performed] }
              type: { type: string, enum: [prolong, order] }
              amount: { type: integer, minimum: 0, description: Eurocents. }
    DemoGenerateRequest:
      type: object
      additionalProperties: false
      required: [scenario]
      properties:
        scenario: { type: string, enum: [NORMAL_ACTIVITY, ACTIVITY_DROP, CHURN_RISK_SPIKE, HIGH_RISK_THRESHOLD, CUSTOMER_RECOVERY, NEW_CUSTOMER_ACTIVITY] }
        customerId: { type: [string, 'null'], maxLength: 160 }
        eventId: { type: [string, 'null'], minLength: 1, maxLength: 120 }
    SimulatorStartRequest:
      type: object
      additionalProperties: false
      properties:
        intervalSeconds: { type: number, minimum: 2, maximum: 60, default: 5 }
        scenario: { type: string, enum: [NORMAL_ACTIVITY, ACTIVITY_DROP, CHURN_RISK_SPIKE, HIGH_RISK_THRESHOLD, CUSTOMER_RECOVERY, NEW_CUSTOMER_ACTIVITY, MIXED], default: MIXED }
    ReactionTemplatePatch:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: [boolean, 'null'] }
        subject: { type: [string, 'null'], minLength: 1, maxLength: 240 }
        body: { type: [string, 'null'], minLength: 1, maxLength: 4000 }
        cooldownSeconds: { type: [integer, 'null'], minimum: 0, maximum: 86400 }
        channelStrategy: { type: [string, 'null'], enum: [social_first, email_first, null] }
    ReactionAction:
      type: object
      required: [id, eventId, templateId, channel, subject, body, status, mode, createdAt]
      properties:
        id: { type: integer }
        eventId: { type: string }
        templateId: { type: string }
        customerId: { type: [string, 'null'] }
        channel: { type: string, example: telegram }
        recipient: { type: [string, 'null'] }
        subject: { type: string }
        body: { type: string }
        status: { type: string, example: simulated_sent }
        mode: { type: string, example: DEMO }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
    RealtimeEvent:
      type: object
      required: [id, eventId, type, source, mode, timestamp, severity, riskScore, riskPercent, riskLevel, riskDelta, reason, reasons, details, processed, notificationCreated, createdAt]
      properties:
        id: { type: integer }
        eventId: { type: string }
        type: { type: string }
        source: { type: string }
        mode: { type: string, enum: [LIVE, DEMO] }
        scenario: { type: [string, 'null'] }
        customerId: { type: [string, 'null'] }
        customerEmail: { type: [string, 'null'] }
        timestamp: { type: string, format: date-time }
        severity: { type: string, enum: [critical, warning, info] }
        previousRiskScore: { type: [number, 'null'], minimum: 0, maximum: 1 }
        riskScore: { type: number, minimum: 0, maximum: 1 }
        riskPercent: { type: integer, minimum: 0, maximum: 100 }
        riskLevel: { type: string }
        riskDelta: { type: number, minimum: -1, maximum: 1 }
        reason: { type: string }
        reasons: { type: array, items: { type: string } }
        details: { type: object, additionalProperties: true }
        processed: { type: boolean }
        notificationCreated: { type: boolean }
        notificationId: { type: [integer, 'null'] }
        suppressedReason: { type: [string, 'null'] }
        actions: { type: array, items: { $ref: '#/components/schemas/ReactionAction' } }
        duplicate: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }
    RealtimeEventListResponse:
      type: object
      required: [items, total, latestId, generatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RealtimeEvent' } }
        total: { type: integer }
        latestId: { type: integer }
        generatedAt: { type: string, format: date-time }
    CustomerRealtimeHistoryResponse:
      type: object
